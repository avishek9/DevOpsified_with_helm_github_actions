# .github/workflows/terraform.yaml
name: Terraform Plan and Apply

on:
  push:
    branches:
      - master
    paths:
      - 'lab1-vpc/**'
      - 'lab-gke/**'
      - 'lab3-shared-vpc/**'
      - 'project-factory/**'
      - '.github/workflows/terraform.yaml'
  pull_request:
    branches:
      - master
    paths:
      - 'lab1-vpc/**'
      - 'lab-gke/**'
      - 'lab3-shared-vpc/**'
      - 'project-factory/**'
      - '.github/workflows/terraform.yaml'

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changed.outputs.modules }}
      has-changes: ${{ steps.changed.outputs.has-changes }}

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: detect changed modules
        id: changed
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
            HEAD=${{ github.event.pull_request.head.sha }}
            CHANGED_FILES=$(git diff --name-only $BASE $HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi

          echo "changed files:"
          echo "$CHANGED_FILES"

          declare -A MODULE_MAP
          MODULE_MAP["lab1-vpc/"]="lab1-vpc/environments/dev"
          MODULE_MAP["lab-gke/"]="lab-gke/environments/prod"
          MODULE_MAP["lab3-shared-vpc/environments/lab/host/"]="lab3-shared-vpc/environments/lab/host"
          MODULE_MAP["lab3-shared-vpc/environments/lab/projects/"]="lab3-shared-vpc/environments/lab/projects"
          MODULE_MAP["lab3-shared-vpc/environments/lab/service-a/"]="lab3-shared-vpc/environments/lab/service-a"
          MODULE_MAP["lab3-shared-vpc/environments/lab/service-b/"]="lab3-shared-vpc/environments/lab/service-b"

          MODULES=()
          for PREFIX in "${!MODULE_MAP[@]}"; do
            if echo "$CHANGED_FILES" | grep -q "^$PREFIX"; then
              MODULE="${MODULE_MAP[$PREFIX]}"
              if [[ ! " ${MODULES[@]} " =~ " ${MODULE} " ]]; then
                MODULES+=("$MODULE")
                echo "queuing module: $MODULE"
              fi
            fi
          done

          if [ ${#MODULES[@]} -eq 0 ]; then
            echo "no terraform modules changed"
            echo "modules=[]" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          JSON=$(printf '%s\n' "${MODULES[@]}" | jq -R . | jq -s -c .)
          echo "modules=$JSON" >> $GITHUB_OUTPUT
          echo "has-changes=true" >> $GITHUB_OUTPUT
          echo "final module matrix: $JSON"

  terraform:
    name: "Terraform - ${{ matrix.module }}"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'

    strategy:
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
      fail-fast: false

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: true

      - name: terraform init
        id: init
        run: terraform init

      - name: terraform fmt check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: terraform validate
        id: validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: terraform plan -out=tfplan -detailed-exitcode
        continue-on-error: true

      - name: post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('${{ matrix.module }}')
            );
            if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
              });
            }

            const fmtOutcome = '${{ steps.fmt.outcome }}';
            const initOutcome = '${{ steps.init.outcome }}';
            const validateOutcome = '${{ steps.validate.outcome }}';
            const planOutcome = '${{ steps.plan.outcome }}';

            const fmtResult = fmtOutcome === 'success' ? 'pass' : 'needs formatting';
            const initResult = initOutcome === 'success' ? 'pass' : 'fail';
            const validateResult = validateOutcome === 'success' ? 'pass' : 'fail';
            const planResult = planOutcome === 'success' ? 'pass' : 'fail';

            const output = `### Terraform Plan: \`${{ matrix.module }}\`
            | Step | Result |
            |------|--------|
            | Format | ${fmtResult} |
            | Init | ${initResult} |
            | Validate | ${validateResult} |
            | Plan | ${planResult} |

            <details>
            <summary>Show Plan Output</summary>

            \`\`\`hcl
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            </details>

            *triggered by @${{ github.actor }} on \`${{ github.ref_name }}\`*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: output,
            });

      - name: check plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: terraform apply
        if: |
          github.ref == 'refs/heads/master' &&
          github.event_name == 'push' &&
          steps.plan.outcome == 'success' &&
          steps.plan.outputs.exitcode == '2'
        run: terraform apply -auto-approve tfplan