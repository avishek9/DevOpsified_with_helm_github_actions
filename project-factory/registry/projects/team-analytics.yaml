# registry/projects/team-analytics.yaml
#
# Analytics team — greenfield GCP workload, no on-prem dependency.
# connect_to_onprem: false — pure cloud-native.

project:
  id: acme-analytics-prod
  name: "Analytics — Production"
  environment: prod
  team: analytics
  cost_center: "CC-1002"

networking:
  subnet_cidr: "10.60.0.0/20"
  pods_cidr: "10.160.0.0/18"
  services_cidr: "10.260.0.0/22"
  connect_to_onprem: false
  shared_vpc: true

iam:
  owners:
    - group:analytics-leads@acme.com
  editors:
    - group:analytics-engineers@acme.com
  viewers:
    - group:security-audit@acme.com

gke:
  enabled: true
  node_pool_size: large
  release_channel: REGULAR

budget:
  monthly_limit_usd: 15000
  alert_thresholds: [50, 75, 90, 100]
  alert_emails:
    - analytics-leads@acme.com
    - finops@acme.com
