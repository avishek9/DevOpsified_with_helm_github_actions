{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "my-service.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "my-service.labels" . | nindent 4 }}
  annotations:
    {{- /*
      Annotations from values.yaml — includes the Workload Identity annotation.
      The iam.gke.io/gcp-service-account annotation is what tells the GKE
      metadata server to issue tokens for the linked GCP SA.
      If the annotation value is empty, we skip it so the SA is created
      without the annotation rather than with an empty value.
    */}}
    {{- range $key, $val := .Values.serviceAccount.annotations }}
    {{- if $val }}
    {{ $key }}: {{ $val | quote }}
    {{- end }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
