apiVersion: v1
kind: Service
metadata:
  name: {{ include "my-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "my-service.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      {{- /*
        targetPort references the named port "http" defined on the container.
        Using the name instead of the number means if the port number changes,
        you only update the Deployment — the Service automatically follows.
      */}}
      protocol: TCP
      name: http
  selector:
    {{- include "my-service.selectorLabels" . | nindent 4 }}
    {{- /*
      selector uses the same labels as Deployment.spec.selector.matchLabels.
      Defined in _helpers.tpl — cannot drift.
    */}}
